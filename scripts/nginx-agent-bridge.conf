# Add to the nginx config that serves :443 (http context: zones).
limit_req_zone $binary_remote_addr zone=hermes_bridge_rate:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=hermes_bridge_pair:10m rate=3r/m;

# server context:
# Pairing: one-time code, no auth header, tightly rate-limited.
location = /hermes/agent-bridge/pair {
    limit_req zone=hermes_bridge_pair burst=3 nodelay;
    proxy_pass http://127.0.0.1:8787/pair;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
}

# Device WebSocket: auth (device token) is enforced by the bridge itself.
location ^~ /hermes/agent-bridge {
    limit_req zone=hermes_bridge_rate burst=10 nodelay;
    limit_conn hermes_conn 20;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
