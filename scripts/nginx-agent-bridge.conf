# Put these two blocks in the nginx config that serves :443.
# http context:
map $http_authorization $hermes_bridge_ok {
    default 0;
    "Bearer __BRIDGE_TOKEN__" 1;
}
limit_req_zone $binary_remote_addr zone=hermes_bridge_rate:10m rate=2r/s;

# server context:
location ^~ /hermes/agent-bridge {
    if ($hermes_bridge_ok = 0) { return 401; }
    limit_req zone=hermes_bridge_rate burst=10 nodelay;
    limit_conn hermes_conn 20;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
